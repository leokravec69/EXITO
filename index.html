<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EXITO Professional — колорист</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Marck+Script&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d1d1f; --ink2:#55555a; --mute:#8d8d93; --line:#e4e4e6; --paper:#ffffff; --bg:#f6f6f5;
  --g1:#f29a2e; --g2:#e4602b; --g3:#b8323c; --g4:#7a2348; --g5:#5a2a6b;
  --grad:linear-gradient(115deg,var(--g1) 0%,var(--g2) 28%,var(--g3) 55%,var(--g4) 78%,var(--g5) 100%);
  --r:4px; --choc:#22110e; --terra:#9a4824;
  --site:linear-gradient(100deg,#1e0f0c 0%,#3a1b13 48%,#8c4321 100%);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative;padding-bottom:calc(84px + env(safe-area-inset-bottom));box-shadow:0 0 40px rgba(0,0,0,.05)}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);padding:calc(12px + env(safe-area-inset-top)) 18px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.top .ttl{font-weight:700;font-size:15px;letter-spacing:.02em;flex:1}
.back{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--bg)}
.wrap{padding:18px}
.tag{display:inline-block;background:#1d1d1f;color:#fff;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:6px 14px 5px;font-size:15px}
.tag.sm{font-size:11px;padding:4px 9px 3px}
.h2{font-size:20px;font-weight:700;margin:4px 0 6px;letter-spacing:-.01em}
.sub{color:var(--ink2);font-size:13.5px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:20px 0 10px}
.script{font-family:'Marck Script',cursive;font-weight:400}
/* base recipes + guide */
.base3{display:grid;gap:10px;margin-top:4px}
.bc{border:1px solid var(--line);border-radius:4px;overflow:hidden}
.bch{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg)}
.bch .hair{width:24px;flex:none}
.bch b{font-size:13.5px}.bch small{display:block;font-size:11.5px;color:var(--mute)}
.bcb{padding:10px 12px;font-size:13px;display:grid;gap:6px}
.bcb .f{font-weight:700;font-size:14px}
.bcb .ox{display:inline-block;background:#1d1d1f;color:#fff;font-weight:700;font-size:12px;padding:3px 8px;border-radius:2px}
.bcb .ox.prep{background:var(--terra)}
.bcb .nt{font-size:12px;color:var(--ink2)}
.call{display:flex;align-items:center;gap:12px;margin:18px;padding:16px;background:var(--site);color:#fff;border-radius:4px;text-decoration:none}
.call .ci{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.call b{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.85;font-weight:600}
.call span{font-size:19px;font-weight:700;letter-spacing:.02em}
.art{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 0;border-bottom:1px solid var(--line)}
.art .an{width:34px;height:34px;flex:none;background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--terra);border-radius:4px}
.art b{display:block;font-size:14.5px}.art small{font-size:12px;color:var(--mute)}
.prose{font-size:14px;line-height:1.55}
.prose h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:20px 0 8px}
.prose ul,.prose ol{padding-left:18px;display:grid;gap:6px}
.prose p{margin:8px 0}
/* hero */
.shero{position:relative;background:var(--site);color:#fff;overflow:hidden;min-height:470px;padding:calc(22px + env(safe-area-inset-top)) 20px 28px;display:flex;flex-direction:column}
.shero .ph{position:absolute;right:-40px;top:0;bottom:0;width:78%;background-size:cover;background-position:center top;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 45%);mask-image:linear-gradient(90deg,transparent 0%,#000 45%)}
.shero .in{position:relative;display:flex;flex-direction:column;flex:1}
.shero .eyebrow{font-size:11.5px;letter-spacing:.22em;font-weight:500;margin:26px 0 12px}
.shero h1{font-size:40px;line-height:1.02;font-weight:600;text-transform:uppercase;letter-spacing:-.01em;max-width:250px}
.shero p{font-size:13px;color:rgba(255,255,255,.82);max-width:230px;margin:16px 0 22px}
.banner{position:relative;color:#fff;min-height:220px;display:flex;align-items:flex-end;padding:20px;background:#2a1511 center/cover no-repeat;overflow:hidden}
.banner::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(25,12,9,.88) 0%,rgba(25,12,9,.25) 60%,rgba(25,12,9,.05))}
.banner .in{position:relative}
.banner h2{font-size:28px;line-height:1.05;font-weight:600;text-transform:uppercase}
.banner p{font-size:12.5px;color:rgba(255,255,255,.85);margin-top:6px;max-width:300px}
.hero{position:relative;overflow:hidden;padding:30px 20px 26px;min-height:330px}
.hero svg.poly{position:absolute;inset:0;width:100%;height:100%}
.hero .in{position:relative}
.hero p{max-width:255px;color:var(--ink2);font-size:13.5px;margin-top:14px}
.ribbon{position:relative;margin:0 0 4px;padding:22px 20px 24px;background:var(--grad);color:#fff;overflow:hidden}
.ribbon svg{position:absolute;inset:0;width:100%;height:100%;opacity:.35}
.ribbon .in{position:relative}
.ribbon b{font-weight:700;font-size:13px;font-style:italic;display:block;margin-bottom:6px;opacity:.95}
.ribbon .script{font-size:27px;line-height:1.15;display:block}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:18px}
.mi{border:1px solid var(--line);border-radius:var(--r);padding:16px 14px;text-align:left;background:#fff;display:flex;flex-direction:column;gap:6px;min-height:118px;position:relative;overflow:hidden}
.mi.main{grid-column:1/-1;background:var(--site);color:#fff;border-color:#1d1d1f;min-height:auto;flex-direction:row;align-items:center;gap:14px}
.mi.main .ic{background:rgba(255,255,255,.14)}
.mi .ic{width:38px;height:38px;border-radius:10px;background:var(--bg);display:grid;place-items:center;flex:none}
.mi b{font-size:14.5px}
.mi span{font-size:12px;color:var(--mute);line-height:1.35}
.mi.main span{color:#bbb}
.foot{padding:6px 18px 26px;color:var(--mute);font-size:12px}
.foot a{color:var(--ink);font-weight:600;text-decoration:none}
/* nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:30}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--mute);padding:4px 0}
.nav button.on{color:var(--ink)}
.nav button.on svg{stroke:url(#gradStroke)}
.nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* chips */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);border-radius:2px;padding:7px 13px;font-size:12.5px;font-weight:600;white-space:nowrap;background:#fff}
.chip.on{background:#1d1d1f;color:#fff;border-color:#1d1d1f}
/* swatches */
.sw{display:flex;flex-direction:column;align-items:center;gap:5px}
.hair{width:100%;aspect-ratio:.62;clip-path:polygon(18% 0,82% 0,100% 100%,0 100%);position:relative}
.hair::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,transparent 1px 3px,rgba(0,0,0,.08) 3px 4px,transparent 4px 6px),linear-gradient(180deg,rgba(255,255,255,.12),transparent 40%,rgba(0,0,0,.15))}
.sw .code{font-size:11.5px;font-weight:700}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px 9px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.lvlrow{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;margin-bottom:12px}
.lvlnum{font-size:20px;font-weight:300;color:var(--mute);text-align:center}
.rowsw{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.rowsw .sw{width:52px;flex:none}
.nuhead{display:flex;align-items:center;gap:10px;margin:22px 0 12px}
.nuflag{width:44px;height:26px;clip-path:polygon(0 18%,100% 0,100% 100%,0 100%);display:grid;place-items:center;font-weight:800;font-size:12px}
/* cards */
.card{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:#fff;margin-bottom:12px}
.card.dark{background:var(--site);color:#fff;border-color:transparent}
.warn{border-left:3px solid var(--g2);background:#fff6ef;padding:11px 13px;border-radius:0 10px 10px 0;font-size:13px;margin:10px 0}
.warn.red{border-color:var(--g3);background:#fdf0f1}
.warn.info{border-color:#8d8d93;background:var(--bg)}
.warn b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
/* wizard */
.steps{display:flex;gap:6px;margin-bottom:16px}
.steps button{flex:1;text-align:left;font-size:11px;font-weight:700;color:var(--mute);padding-top:8px;border-top:3px solid var(--line);letter-spacing:.03em}
.steps button.on{color:var(--ink);border-image:var(--grad) 1}
.steps button.done{color:var(--ink2);border-color:#1d1d1f}
.steps button:disabled{cursor:default}
.seg{display:flex;background:var(--bg);border-radius:4px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 4px;border-radius:3px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.zone{border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.zone.off{opacity:.45}
.zhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.zhead b{font-size:14px}
.tog{width:44px;height:26px;border-radius:20px;background:var(--line);position:relative;transition:.2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tog.on{background:#1d1d1f}.tog.on::after{left:21px}
.lvls{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:10px 0}
.lv{aspect-ratio:.7;border-radius:6px;display:grid;place-items:end center;padding-bottom:3px;font-size:11px;font-weight:700;color:#fff;border:2px solid transparent;position:relative}
.lv.light{color:#1d1d1f}
.lv.on{border-color:#fff;box-shadow:0 0 0 2px #1d1d1f}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:2px;background:#1d1d1f;color:#fff;font-weight:700;font-size:13.5px;letter-spacing:.08em;text-transform:uppercase}
.btn.grad{background:var(--site)}
.btn.white{background:#fff;color:#111;width:auto;display:inline-flex;padding:15px 26px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.35}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nugrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nub{border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;gap:9px;align-items:center;text-align:left;background:#fff}
.nub.on{border-color:#1d1d1f;box-shadow:0 0 0 1px #1d1d1f}
.nub .dot{width:26px;height:38px;flex:none;clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}
.nub b{font-size:13px;display:block}
.nub small{font-size:10.5px;color:var(--mute);line-height:1.2;display:block}
/* recipe */
.rz{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);margin-bottom:12px}
.rzh{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg)}
.rzh .hair{width:30px;flex:none}
.rzh b{font-size:14px;display:block}
.rzh small{color:var(--mute);font-size:12px}
.rstep{padding:14px;border-top:1px solid var(--line)}
.rstep .n{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--g3);margin-bottom:6px}
.mix{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:8px 0}
.mix .box{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.mix .box b{font-size:18px;display:block}
.mix .box small{font-size:11px;color:var(--ink2)}
.mix .plus{font-weight:300;font-size:22px;color:var(--mute)}
.kv{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink2);margin-top:6px}
.kv span b{color:var(--ink)}
.qty{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);margin-top:8px}
.qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);font-weight:700}
/* care */
.line{margin-bottom:26px}
.line p{font-size:13px;color:var(--ink2);margin:10px 0 12px}
.prods{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.prod{flex:none;width:132px;border:1px solid var(--line);border-radius:12px;padding:10px;background:linear-gradient(160deg,#fff 40%,#f1f1f0);text-align:center}
.prod svg{height:110px;width:100%}
.prod b{font-size:11.5px;display:block;line-height:1.3;margin-top:6px}
.prod small{font-size:11px;color:var(--mute)}
.ingr{display:flex;flex-wrap:wrap;gap:6px}
.ingr span{font-size:11px;font-weight:600;background:var(--bg);border-radius:20px;padding:4px 10px}
/* table */
table{width:100%;border-collapse:collapse;font-size:12.5px}
td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:700}
td.c{white-space:nowrap;font-weight:700}
/* sheet */
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto}
.grip{width:40px;height:4px;border-radius:4px;background:var(--line);margin:-6px auto 14px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:10px 16px;border-radius:30px;font-size:13px;z-index:60}
.fade{animation:fd .25s ease}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="gradStroke" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f29a2e"/><stop offset=".5" stop-color="#b8323c"/><stop offset="1" stop-color="#5a2a6b"/></linearGradient></defs></svg>
<div id="app"></div>
<script>
/* ================= ДАННЫЕ ================= */
const NU = [
 {c:'0', n:'натуральный', lv:[1,3,4,5,6,7,8,9,10], t:null, flag:'#5f5c58', cool:true},
 {c:'00',n:'натуральный насыщенный (для седины)', lv:[3,4,5,6,7,8,9,10], t:'#3a2416', flag:'#4d4540', cool:true},
 {c:'1', n:'пепельный', lv:[1,5,6,7,8,9,10], t:'#8c9096', flag:'#9a9a9a', cool:true},
 {c:'13',n:'пепельно-золотистый', lv:[8,9,10], t:'#b3a37e', flag:'#d6d36c', cool:true},
 {c:'3', n:'золотистый', lv:[5,6,7,8,9,10], t:'#e0ae4c', flag:'#f0dc5a'},
 {c:'34',n:'золотисто-медный', lv:[6,7,8,9], t:'#d98a3a', flag:'#eea84b'},
 {c:'36',n:'золотисто-фиолетовый', lv:[7,8,9,10], t:'#a88f86', flag:'#c9d36a'},
 {c:'4', n:'медный', lv:[5,6,7,8,9], t:'#d9662a', flag:'#ec8a46'},
 {c:'43',n:'медно-золотистый', lv:[7,8,9,10], t:'#e08b36', flag:'#f0b44a'},
 {c:'5', n:'красный', lv:[4,5,6,7,8,9,10], t:'#b8302b', flag:'#e05454'},
 {c:'6', n:'фиолетовый', lv:[3,4,5,6,7,8,9,10], t:'#7a5aa6', flag:'#5a4fc0', cool:true},
 {c:'7', n:'коричневый', lv:[4,5,6,7,8,9,10], t:'#6e4c33', flag:'#5d5551'},
 {c:'71',n:'коричнево-пепельный', lv:[6,7,8,9,10], t:'#7a706a', flag:'#5a5856', cool:true},
 {c:'75',n:'коричнево-красный', lv:[5,6,7,8,9,10], t:'#86412f', flag:'#5c4a45'},
 {c:'76',n:'коричнево-фиолетовый', lv:[5,6,7,8,9,10], t:'#6c4b5a', flag:'#4b5260'},
 {c:'77',n:'интенсивно-коричневый', lv:[5,6,7], t:'#4e301f', flag:'#57504b'},
 {c:'8', n:'жемчужный', lv:[4,5,6,8,9,10], t:'#a397b6', flag:'#6a3fb0', cool:true},
];
const SB = [
 {code:'100', n:'Special Blonde натуральный', col:'#e9ddb6'},
 {code:'101', n:'Special Blonde пепельный', col:'#d8d6c2'},
];
const LV = {1:'#15110f',2:'#1d1512',3:'#271c17',4:'#33251e',5:'#433027',6:'#584030',7:'#735438',8:'#93724f',9:'#b69871',10:'#d5c09b'};
const LVNAME = {1:'чёрный',2:'очень тёмный шатен',3:'тёмный шатен',4:'шатен',5:'светлый шатен',6:'тёмный блонд',7:'средний блонд',8:'светлый блонд',9:'очень светлый блонд',10:'платиновый блонд'};
const BGP = {1:'—',2:'тёмно-красный',3:'красно-коричневый',4:'красно-коричневый',5:'красный',6:'красно-оранжевый',7:'оранжевый',8:'жёлто-оранжевый',9:'жёлтый',10:'бледно-жёлтый'};

const TECH = [
 {k:'tone',  v:'Тонирование волос', r:'1:2', o:1.5, t:'20–35 мин'},
 {k:'darkB', v:'Затемнение обесцвеченных волос на 2 и более тонов', r:'1:1', o:1.5, t:'35 мин'},
 {k:'darkN', v:'Затемнение натуральных или ранее окрашенных волос на 2 и более тонов', r:'1:1', o:3, t:'35 мин'},
 {k:'tt',    v:'Тон в тон · осветление до 1 тона в прикорневой зоне · на 1 тон темнее', r:'1:1,5', o:3, t:'35 мин'},
 {k:'l2',    v:'Осветление до 2 тонов в прикорневой зоне · до 1 тона по длине', r:'1:1,5', o:6, t:'35 мин'},
 {k:'l3',    v:'Осветление до 3 тонов в прикорневой зоне · до 2 тонов по длине', r:'1:1,5', o:9, t:'35 мин'},
 {k:'g17',   v:'Окрашивание седины оттенками 1–7 уровня', r:'1:1,5', o:6, t:'45 мин'},
 {k:'g89',   v:'Окрашивание седины оттенками 8–9 уровня', r:'1:1', o:9, t:'45 мин'},
 {k:'n37',   v:'Натуральные оттенки для седины (X.00) 3–7 уровня', r:'1:1,5', o:6, t:'45 мин'},
 {k:'n89',   v:'Натуральные оттенки для седины (X.00) 8–9 уровня', r:'1:1,5', o:9, t:'45 мин'},
 {k:'n10',   v:'Натуральный оттенок для седины 10 уровня (10.00)', r:'1:2', o:9, t:'45 мин'},
 {k:'sb',    v:'Осветление до 4–5 тонов рядом Special Blondes', r:'1:2', o:12, t:'50 мин'},

const mix=(a,b,t)=>{const A=hx(a),B=hx(b);return toHex(A.map((v,i)=>v+(B[i]-v)*t))};
const lum=h=>{const [r,g,b]=hx(h);return (0.299*r+0.587*g+0.114*b)/255};
function shadeColor(lv,c){
  if(c==='SB'){return '#e6dab4'}
  const base=LV[lv]; const nu=NU.find(x=>x.c===c);
  if(!nu||!nu.t) return base;
  if(c==='00') return mix(base,'#2a1a10',0.18);
  const s=Math.min(0.75,0.18+lv*0.05);
  return mix(base,nu.t,s);
}
function hairBg(col){return `linear-gradient(90deg,${mix(col,'#000',.18)},${col} 30%,${mix(col,'#fff',.12)} 55%,${col} 75%,${mix(col,'#000',.22)})`}
const nuOf=c=>NU.find(x=>x.c===c);
const shadeName=(lv,c)=>{ if(c&&c.startsWith('SB')){const s=SB.find(x=>'SB'+x.code===c);return s?s.code:''} return `${lv}.${c}` };
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const fmtOx=o=>`${String(o).replace('.',',')}% (${VOL[o]} vol.)`;
const ratioNum=r=>parseFloat(r.split(':')[1].replace(',','.'));

const ZN = {roots:'Корни', mid:'Середина', ends:'Длина и концы'};
const S = {
  screen:'home', step:1, sheet:null, nuFilter:'all',

  zones:{ roots:{on:true,lv:6,st:'NB',ml:30}, mid:{on:true,lv:7,st:'KB',ml:30}, ends:{on:true,lv:7,st:'KB',ml:30} },
  tLv:null, tNu:null,
};
const GRAY = [[0,'нет'],[1,'до 30%'],[2,'30–50%'],[3,'50–70%'],[4,'70–100%']];
const ST = {NB:'Натуральные', KB:'Окрашенные', OB:'Осветлённые'};

/* ================= ДВИЖОК РЕЦЕПТА ================= */
function calcZone(key,z){
  const tLv=S.tLv, tNu=S.tNu, isSB=tNu&&tNu.startsWith('SB');
  const diff=tLv-z.lv; const isRoots=key==='roots';
  const gray = S.gray>0 && z.st==='NB' && isRoots;
  const steps=[]; const notes=[];
  const shade = shadeName(tLv,tNu);
  const dye=(row,sh=shade,extra)=>({kind:'dye',row,shade:sh,extra});
  const bleachStep=(why)=>({kind:'bleach',why});

  if(z.st==='NB'){
    if(isSB){
      if(diff<=5 && diff>=1) steps.push(dye(T.sb));
      else if(diff>5){ steps.push(bleachStep('Подъём больше 5 тонов — ряд Special Blondes не даст нужного уровня.')); steps.push(dye(T.tone,'тонирование оттенком 10 уровня')); }
      else steps.push(dye(T.sb));
      if(gray) notes.push(['red','Седина','Special Blondes в инструкции не указан для окрашивания седины — проверьте результат на пробной пряди.']);
    } else if(gray){
      let row;
      if(tNu==='00'){ row = tLv<=7?T.n37: tLv<=9?T.n89:T.n10; }
      else { row = tLv<=7?T.g17: tLv<=9?T.g89:T.g89; if(tLv===10) notes.push(['red','Седина на 10 уровне','Для седины на 10 уровне инструкция указывает только натуральный оттенок 10.00 (1:2, 9%).']); }
      steps.push(dye(row));
      if(diff>=3) notes.push(['','Седина + осветление','Подъём на '+diff+' тона при седине: на седых волосах цвет будет светлее и прозрачнее, чем на пигментированных.']);
    } else {
      if(diff<=-2) steps.push(dye(T.darkN));
      else if(diff<=0) steps.push(dye(T.tt));
      else if(isRoots){
        if(diff===1) steps.push(dye(T.tt));
        else if(diff===2) steps.push(dye(T.l2));
        else if(diff===3) steps.push(dye(T.l3));
        else { steps.push(bleachStep(diff<=5?'Подъём на '+diff+' тона красителем возможен только рядом Special Blondes (оттенки 100-й серии). Для выбранного нюанса нужно осветление.':'Подъём больше 5 тонов — только обесцвечивание.')); steps.push(dye(T.tone)); }
      } else {
        if(diff===1) steps.push(dye(T.l2));
        else if(diff===2) steps.push(dye(T.l3));
        else { steps.push(bleachStep('По длине краситель осветляет не больше чем на 2 тона.')); steps.push(dye(T.tone)); }
      }
    }
  } else if(z.st==='KB'){
    if(diff>0){
      notes.push(['red','Краска не осветляет краску','Зона окрашена, а нужно светлее на '+diff+' УГТ. Сначала снимите косметический пигмент.']);
      steps.push(bleachStep('Декапирование: снять косметический пигмент до '+tLv+' уровня.'));
      steps.push(dye(T.tone));
    } else if(diff===0) steps.push(dye(T.tone,shade,'Обновление цвета по длине — мягкий режим.'));
    else if(diff===-1) steps.push(dye(T.tt));
    else steps.push(dye(T.darkN));
  } else { // OB
    if(diff>0){ steps.push(bleachStep('Волосы осветлены до '+z.lv+' уровня, а нужен '+tLv+'. Доосветлите до нужного фона.')); steps.push(dye(T.tone)); }
    else if(diff>=-1) steps.push(dye(T.tone));
    else { steps.push(dye(T.darkB)); if(diff<=-3) notes.push(['','Затемнение на '+(-diff)+' тона','Обесцвеченные волосы без тёплого пигмента: при сильном затемнении цвет может уйти в серый/зелёный. Общее правило колористики — предварительная пигментация (не из инструкции EXITO).']); }
  }
  // фон осветления / риск
  const lifts = steps.some(s=>s.kind==='bleach') || (z.st==='NB' && diff>0);
  const nu = isSB? {cool:true} : nuOf(tNu);
  if(lifts && tLv>=7 && nu && nu.cool) notes.push(['','Фон осветления: '+BGP[tLv],'Выбран холодный/натуральный нюанс. Тёплый фон осветления может проявиться — при необходимости нейтрализуйте корректором.']);
  if(z.st!=='NB' && tLv>=9 && (tNu==='0'||tNu==='1'||tNu==='00')) notes.push(['','Подложка '+BGP[tLv],'Уровень '+tLv+' с натуральным/пепельным нюансом на подготовленных волосах — проверьте чистоту фона, при желтизне нужен тонер.']);
  return {steps,notes,diff};
}
function careFor(results){
  const any=k=>Object.values(results).some(r=>r.steps.some(s=>s.kind===k));
  const bleached = any('bleach') || Object.entries(S.zones).some(([k,z])=>z.on&&z.st==='OB') || (S.tNu||'').startsWith('SB');
  const coolBlond = S.tLv>=8 && ((S.tNu||'').startsWith('SB') || (nuOf(S.tNu)||{}).cool);
  const lines=['color'];
  if(bleached||S.tLv>=9) lines.unshift('blond');
  if(coolBlond) lines.push('anti');
  if(bleached) lines.push('keratin');
  return [...new Set(lines)];
}

  return `<div class="card dark" style="display:flex;gap:14px;align-items:center"><div style="width:48px;flex:none">${`<div class="hair" style="background:${hairBg(tCol)}"></div>`}</div>

   <div style="height:12px"></div>
   <button class="btn grad" onclick="useShade(${lv},'${c}')">Рассчитать по моей диагностике</button>`;
  render();
}
function useShade(lv,c){ S.tLv=lv; S.tNu=c; S.sheet=null; S.screen='recipe'; S.step=Object.values(S.zones).some(z=>z.on)?2:1; location.hash='recipe'; render(); scrollTo(0,0); }
function openCare(mode){
  let care=window.__lastRecipe.care;
  if(mode==='salon') care=[...care,'expert']; else care=care.filter(c=>c!=='expert');
  const items = care.flatMap(id=>{const l=CAREMAP[id];
    const pick = l.tech? l.p.filter(p=>/стабилиз/.test(p[1])) : mode==='salon'? l.p.filter(p=>['shampoo','balm','mask'].includes(p[0])) : l.p;
    return pick.map(p=>({l,p}));});
  S.sheet=`<span class="tag sm">${mode==='salon'?'В САЛОНЕ':'ДОМОЙ КЛИЕНТУ'}</span>
   <div class="h2" style="margin-top:10px">${mode==='salon'?'Салонный уход после окрашивания':'Домашний уход для клиента'}</div>
   <div class="sub">${mode==='salon'?'Шампунь и бальзам — сразу после смывания краски; маска — по состоянию волос. Стабилизаторы EXPERT (кислый pH) — после химической услуги.':'Чтобы цвет держался дольше. Для дома — объём 250 мл.'}</div>
   ${care.map(id=>{const l=CAREMAP[id];return `<div style="margin-top:16px"><span class="tag sm" style="background:${l.col}">${l.name}</span> <span class="sub" style="font-size:12px">${l.for}</span>
   <div class="prods" style="margin-top:8px">${items.filter(x=>x.l.id===id).map(({l,p})=>`<div class="prod">${bottle(p[0],l.col)}<b>${p[1]}</b><small>${mode==='home'&&p[2].includes('250')?'250 мл':p[2]}</small></div>`).join('')}</div></div>`}).join('')}
   <div style="height:14px"></div><button class="btn ghost" onclick="S.sheet=null;render()">Закрыть</button>`;
  render();
}
function copyRecipe(){
  const {res,tName,care}=window.__lastRecipe;
  let t=`EXITO — рецепт ${tName}\n`; if(S.gray) t+=`Седина: ${GRAY[S.gray][1]}\n`;
  Object.entries(res).forEach(([k,r])=>{const z=S.zones[k]; t+=`\n${ZN[k]} (УГТ ${z.lv}, ${ST[z.st].toLowerCase()}):\n`;
    r.steps.forEach((s,i)=>{ if(s.kind==='bleach') t+=` ${i+1}. Осветление SUPER BLOND — по инструкции\n`; else t+=` ${i+1}. ${s.shade} ${z.ml} мл + оксигент ${String(s.row.o).replace('.',',')}% ${Math.round(z.ml*ratioNum(s.row.r))} мл (${s.row.r}), ${s.row.t}\n`;});});
  t+=`\nУход: ${care.map(c=>'EXITO '+CAREMAP[c].name).join(', ')}`;
  navigator.clipboard.writeText(t).then(()=>toast('Рецепт скопирован'),()=>toast('Не удалось скопировать'));
}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}

/* ================= НАВИГАЦИЯ ================= */
function go(s){ if(s==='guide') S.article=null; S.screen=s; location.hash=s; render(); scrollTo(0,0); }
function nav(){
  const it=[['home','Главная'],['recipe','Рецепт'],['palette','Палитра'],['care','Уход'],['guide','Справочник']];
  return `<nav class="nav">${it.map(([k,n])=>`<button class="${S.screen===k?'on':''}" onclick="go('${k}')"><svg viewBox="0 0 24 24">${ICON[k]}</svg>${n}</button>`).join('')}</nav>`;
}
function render(){
  const v={home:vHome,recipe:vRecipe,palette:vPalette,care:vCare,guide:vGuide}[S.screen]||vHome;
  document.getElementById('app').innerHTML = v() + nav() + (S.sheet?`<div class="sheetbg" onclick="if(event.target===this){S.sheet=null;render()}"><div class="sheet fade"><div class="grip"></div>${S.sheet}</div></div>`:'');
}
function fromHash(){ let h=location.hash.slice(1); if(h==='tech') h='guide-technology'; if(h.startsWith('guide-')){S.screen='guide';S.article=h.slice(6);} else if(['home','recipe','palette','care','guide'].includes(h)){S.screen=h; if(h==='guide')S.article=null;} render(); }
window.addEventListener('hashchange',fromHash);
fromHash();
</script>
</body>
